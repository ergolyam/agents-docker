name: Build and push codex image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'readme.md'
      - '.github/workflows/maki-publish.yml'
      - 'maki/**'
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/publish-image.yml
    with:
      image: codex
      upstream_url: https://github.com/openai/codex.git
      tag_pattern: '^rust-v[0-9]+(\.[0-9]+)*$'
