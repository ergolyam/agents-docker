name: Build and push maki image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'readme.md'
      - '.github/workflows/codex-publish.yml'
      - 'codex/**'
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/publish-image.yml
    with:
      image: maki
      upstream_url: https://github.com/tontinton/maki.git
      tag_pattern: '^v[0-9]+(\.[0-9]+)*$'
